<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="dashboard">
        <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>
    </div>
   
   
    <div class="cards">
       
       <div class="card1">

           <div class="student" id="total">
               <h2>Total Employee</h2>
               <div class="showdata">
                <span id ="shownum"></span>
               </div>
               <div class="newemployee"><button type="button" id="addnew" class="btn btn-light">add new employee</button></div>
              <div class="viewemp">
                <button class="empoyview" class="btn btn-light" type="button">view</button>
              </div>
               
            </div>
            
            
            <div class="student">
                <h2>active employee</h2>
                <div class="active">
                    <span></span>
                </div>

                <div class="viewactive">
                    <button type="button" class="btn btn-primary">view</button>
                </div>
            </div>
            
            
            <div class="student">
                <h2>unactive employee </h2>
            </div>
            
        </div>
        <div class="card2">

            <div class="student" >
                <h2>TOTAL DEPARTMENT</h2>
            </div>
            
            
            <div class="student" >
                <h2>attendence</h2>
            </div>
            
            
            <div class="student" >
                <h2>low attendence employee
                </h2>
            </div>
        </div>



    </div>

    
</body>
