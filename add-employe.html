<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="add-ems.css">
</head>
<body>

    <div class="input-headding">
        <h1>add information for new employee</h1>

    </div>

    <div class="input-section-parent">

        <div class="input-detailes">
            <div class="input-item">
                
                <input aria-label="name" class="add-employee-inputtag " id="name" type="text" placeholder="enter employee name">
               
                <input class="add-employee-inputtag" type="text" id="department" placeholder="department">

                <input class="add-employee-inputtag" type="tel" 
                id="employeeno"
                placeholder="enter employee number">
               
                <input class="add-employee-inputtag" id="empid" type="id" placeholder="enter employee id">
               
                <input class="add-employee-inputtag" type="text" id="position" placeholder="position">
              
                <input class="add-employee-inputtag" type="number" id="salary" placeholder="salary">
               
                <button class="submit-button" id="submit">submit</button>
            </div>
        </div>
    </div>
    <div class="employee-detailes">
        <table >
            <thead>
                      <tr>
            <th>Employee No</th>
            <th>Employee Name</th>
            <th>Department</th>
            <th>Employee ID</th>
            <th>Position</th>
            <th>Salary</th>
            <th>delete</th>
        </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
    
</body>
<script src="./addemployee.js"></script>
</html>
